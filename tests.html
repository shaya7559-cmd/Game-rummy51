<h1>בדיקות לוגיקה, טורנירים, דוחות וסנכרון</h1>
<p id="sum">רץ…</p>
<ol id="out"></ol>
<script src="logic.js"></script>
<script src="stats.js"></script>
<script src="tournaments.js"></script>
<script src="sync.js"></script>
<script>
(async function () {
  'use strict';
  const R = Rummy, ST = RummyStats, SY = RummySync;
  const tests = [];
  const test = (name, fn) => tests.push([name, fn]);
  function eq(actual, expected, msg) {
    const a = JSON.stringify(actual), e = JSON.stringify(expected);
    if (a !== e) throw new Error((msg ? msg + ': ' : '') + 'expected ' + e + ', got ' + a);
  }
  function ok(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }

  // pts[k] for every non-winner: a number, or 'X' = did not lay down a set.
  function play(g, winnerIdx, pts, hand) {
    const i = R.currentIndex(g);
    const res = { winnerId: g.players[winnerIdx].id, hand: !!hand, entries: {} };
    g.players.forEach((p, k) => {
      if (k === winnerIdx) return;
      res.entries[p.id] = pts[k] === 'X' ? { noSet: true } : { points: pts[k], noSet: false };
    });
    const err = R.validateResult(g, res);
    if (err) throw new Error(err);
    R.setResult(g, i, res);
    return i;
  }
  const totalsByName = (g) => { const t = R.totals(g), o = {}; g.players.forEach((p) => { o[p.name] = t[p.id]; }); return o; };

  // ---------------- logic ----------------
  test('12 תורים, גלוק אוטומטי בתורים 4, 8, 12', () => {
    const g = R.newGame(['א', 'ב', 'ג', 'ד']);
    eq(g.rounds.length, 12);
    eq(g.rounds.map((r, i) => r.gluck ? i + 1 : 0).filter(Boolean), [4, 8, 12]);
    eq(g.rounds[3].gluckSource, 'auto');
  });

  test('המחלק מתחלף כל תור, מתחילים מהמחלק הראשון שנבחר', () => {
    const g = R.newGame(['א', 'ב', 'ג', 'ד'], { firstDealer: 2 });
    eq([0, 1, 2, 3, 4].map((i) => R.dealer(g, i).name), ['ג', 'ד', 'א', 'ב', 'ג']);
  });

  test('ניקוד רגיל: מנצח ‎-30, קלפים, ו-100 למי שלא הוריד', () => {
    const g = R.newGame(['א', 'ב', 'ג', 'ד']);
    play(g, 0, [0, 10, 'X', 0]);
    eq(R.roundScores(g, g.rounds[0]), { p1: -30, p2: 10, p3: 100, p4: 0 });
  });

  test('האנט מכפיל הכול (×2)', () => {
    const g = R.newGame(['א', 'ב', 'ג', 'ד']);
    play(g, 0, [0, 10, 'X', 7], true);
    eq(R.roundScores(g, g.rounds[0]), { p1: -60, p2: 20, p3: 200, p4: 14 });
  });

  test('גלוק + האנט = ×4', () => {
    const g = R.newGame(['א', 'ב', 'ג']);
    play(g, 0, [0, 1, 1]); play(g, 0, [0, 1, 1]); play(g, 0, [0, 1, 1]);
    play(g, 1, [10, 0, 'X'], true); // round 4 is gluck
    eq(R.roundScores(g, g.rounds[3]), { p1: 40, p2: -120, p3: 400 });
  });

  test('סכום מצטבר בכל שורה, ועריכה של תור ישן מעדכנת את הכול', () => {
    const g = R.newGame(['א', 'ב']);
    play(g, 0, [0, 20]);
    play(g, 1, [15, 0]);
    const t = R.scoreTable(g);
    eq(t.rows[0].totals, { p1: -30, p2: 20 });
    eq(t.rows[1].totals, { p1: -15, p2: -10 });
    R.setResult(g, 0, { winnerId: 'p1', hand: false, entries: { p2: { points: 50, noSet: false } } });
    eq(R.scoreTable(g).rows[1].totals, { p1: -15, p2: 20 });
  });

  test('פריש: התור הנוכחי הופך לגלוק והמחלק לא משתנה', () => {
    const g = R.newGame(['א', 'ב', 'ג']);
    const before = R.dealer(g, 0).name;
    const res = R.declareFresh(g);
    eq(res.gluckIndex, 0);
    eq(g.rounds[0].gluck, true);
    eq(g.rounds[0].gluckSource, 'fresh');
    eq(g.rounds[0].freshCount, 1);
    eq(R.currentIndex(g), 0, 'still the same round');
    eq(R.dealer(g, 0).name, before);
  });

  test('פריש שני באותו תור מעביר את הגלוק לתור הבא', () => {
    const g = R.newGame(['א', 'ב', 'ג']);
    R.declareFresh(g);
    const res = R.declareFresh(g);
    eq(res.gluckIndex, 1);
    eq(g.rounds[0].freshCount, 2);
  });

  test('פריש בתור גלוק מדלג על תורי גלוק עד התור הפנוי הבא', () => {
    const g = R.newGame(['א', 'ב', 'ג']);
    R.declareFresh(g); R.declareFresh(g); // rounds 1, 2 gluck
    play(g, 0, [0, 1, 1]); play(g, 0, [0, 1, 1]); play(g, 0, [0, 1, 1]);
    eq(R.currentIndex(g), 3);
    const res = R.declareFresh(g); // round 4 is auto gluck → round 5
    eq(res.gluckIndex, 4);
  });

  test('פריש כשכל התורים שנותרו גלוק מבקש להוסיף תור, ותור שנוסף הוא גלוק', () => {
    const g = R.newGame(['א', 'ב'], { rounds: 4 });
    play(g, 0, [0, 1]); play(g, 0, [0, 1]); play(g, 0, [0, 1]);
    const res = R.declareFresh(g);
    eq(res.needsExtraRound, true);
    const idx = R.addRound(g, 'fresh');
    eq(idx, 4);
    eq(g.rounds[4].gluck, true);
    eq(g.rounds[4].gluckSource, 'fresh');
  });

  test('תורים שנוספים ממשיכים את הדפוס: תור 16 גלוק', () => {
    const g = R.newGame(['א', 'ב']);
    for (let k = 0; k < 4; k++) R.addRound(g);
    eq(g.rounds.slice(12).map((r) => r.gluck), [false, false, false, true]);
  });

  test('גלוק ידני ידליק ויכבה', () => {
    const g = R.newGame(['א', 'ב']);
    R.setGluck(g, 1, true);
    eq([g.rounds[1].gluck, g.rounds[1].gluckSource], [true, 'manual']);
    R.setGluck(g, 3, false);
    eq(g.rounds[3].gluck, false);
  });

  test('בדיקת תקינות של תוצאת תור', () => {
    const g = R.newGame(['א', 'ב', 'ג']);
    eq(R.validateResult(g, { winnerId: null, entries: {} }), 'בחר מי ניצח בתור');
    eq(R.validateResult(g, { winnerId: 'p1', entries: { p2: { points: 5 } } }), 'חסר ניקוד לג');
    eq(R.validateResult(g, { winnerId: 'p1', entries: { p2: { points: '' }, p3: { noSet: true } } }), 'חסר ניקוד לב');
    eq(R.validateResult(g, { winnerId: 'p1', entries: { p2: { points: -3 }, p3: { noSet: true } } }), 'חסר ניקוד לב');
    eq(R.validateResult(g, { winnerId: 'p1', entries: { p2: { points: '0' }, p3: { noSet: true } } }), null);
  });

  test('סיום מוקדם: נשמרים רק התורים ששוחקו, והמנצח הוא בעל הניקוד הנמוך', () => {
    const g = R.newGame(['א', 'ב', 'ג']);
    play(g, 1, [10, 0, 20]); play(g, 1, [5, 0, 5]); play(g, 0, [0, 40, 3]);
    R.finishGame(g);
    eq(g.rounds.length, 3);
    eq([g.endedEarly, g.plannedRounds], [true, 12]);
    eq(R.playerById(g, g.winnerId).name, 'ב');
    ok(g.finishedAt, 'finishedAt set');
  });

  test('תיקו: המנצח שנבחר מקבל מקום ראשון', () => {
    const g = R.newGame(['א', 'ב', 'ג'], { rounds: 2 });
    play(g, 0, [0, 10, 50]); play(g, 1, [10, 0, 50]);
    eq(R.leaders(g).map((p) => p.name), ['א', 'ב']);
    R.finishGame(g, 'p2');
    const rank = R.ranking(g);
    eq(rank.map((r) => [r.player.name, r.place]), [['ב', 1], ['א', 2], ['ג', 3]]);
  });

  // ---------------- stats ----------------
  function makeHistory() {
    const g1 = R.newGame(['A', 'B', 'C'], { rounds: 2 });
    play(g1, 0, [0, 10, 20]); play(g1, 1, [5, 0, 'X']);
    R.finishGame(g1); g1.finishedAt = '2025-12-20T20:00:00.000Z';
    const g2 = R.newGame(['A', 'B', 'C'], { rounds: 2 });
    play(g2, 0, [0, 15, 'X'], true); play(g2, 1, [40, 0, 10]);
    R.finishGame(g2); g2.finishedAt = '2026-08-15T20:00:00.000Z';
    const g3 = R.newGame(['A', 'B', 'C'], { rounds: 2 });
    play(g3, 1, [50, 0, 5]); play(g3, 2, [30, 0, 0]);
    R.finishGame(g3); g3.finishedAt = '2026-10-31T20:00:00.000Z';
    return [g3, g1, g2]; // out of order on purpose
  }

  test('הניקוד הסופי של משחקי הדוגמה', () => {
    const [g3, g1, g2] = makeHistory();
    eq(totalsByName(g1), { A: -25, B: -20, C: 120 });
    eq(totalsByName(g2), { A: -20, B: 0, C: 210 });
    eq(totalsByName(g3), { A: 80, B: -30, C: -25 });
  });

  test('טבלת מנצחים, כלל הנקודות ורצפים', () => {
    const s = ST.summary(makeHistory());
    const by = {}; s.players.forEach((p) => { by[p.name] = p; });
    eq(s.players.map((p) => p.name), ['A', 'B', 'C']);
    eq([by.A.wins, by.B.wins, by.C.wins], [2, 1, 0]);
    eq([by.A.totalPoints, by.B.totalPoints, by.C.totalPoints], [35, -50, 305]);
    eq([by.A.best, by.A.worst], [-25, 80]);
    eq([by.A.longestStreak, by.A.currentStreak, by.B.currentStreak], [2, 0, 1]);
    eq(by.A.handWins, 1);
    eq(by.C.hundreds, 2);
    eq([by.B.roundsWon, by.B.roundsPlayed], [3, 6]);
    eq(by.A.avgPlace.toFixed(2), '1.67');
  });

  test('סטטיסטיקות כלליות', () => {
    const g = ST.summary(makeHistory()).general;
    eq([g.games, g.rounds, g.handWins], [3, 6, 1]);
    eq([g.costliestRound.name, g.costliestRound.points], ['C', 210 - 10]);
    eq(g.longestStreak, { name: 'A', length: 2 });
    eq(g.mostWins, { name: 'A', wins: 2 });
  });

  test('מי ניצח בפעם הקודמת, וסינון לפי תקופה', () => {
    const h = makeHistory();
    eq(R.playerById(ST.lastGame(h), ST.lastGame(h).winnerId).name, 'B');
    const now = new Date('2026-11-01T10:00:00.000Z');
    eq(ST.filterByPeriod(h, 'all', now).length, 3);
    eq(ST.filterByPeriod(h, 'year', now).length, 2);
    eq(ST.filterByPeriod(h, '30d', now).length, 1);
  });

  test('ראש בראש', () => {
    eq(ST.headToHead(makeHistory(), 'A', 'B'), { together: 3, a: 2, b: 1, even: 0 });
  });

  // ---------------- sync (against a fake GitHub) ----------------
  function fakeGitHub() {
    const files = {};
    let n = 0;
    const resp = (status, body) => ({ status, ok: status >= 200 && status < 300, json: async () => body, text: async () => JSON.stringify(body) });
    async function handler(url, init) {
      if (init.headers.Authorization !== 'Bearer good') return resp(401, {});
      const path = decodeURIComponent(new URL(url).pathname);
      if (path === '/repos/me/data') return resp(200, { full_name: 'me/data', private: true });
      const m = /^\/repos\/me\/data\/contents\/(.+)$/.exec(path);
      if (!m) return resp(404, {});
      const p = m[1];
      if (init.method === 'GET') {
        if (files[p]) return resp(200, { type: 'file', path: p, sha: files[p].sha, content: files[p].content });
        const prefix = p + '/';
        const list = Object.keys(files).filter((k) => k.startsWith(prefix) && !k.slice(prefix.length).includes('/'))
          .map((k) => ({ type: 'file', name: k.slice(prefix.length), path: k, sha: files[k].sha }));
        return list.length ? resp(200, list) : resp(404, {});
      }
      const body = JSON.parse(init.body);
      if (init.method === 'PUT') {
        if (files[p] ? body.sha !== files[p].sha : body.sha) return resp(409, {});
        files[p] = { content: body.content, sha: 's' + (++n) };
        return resp(200, { content: { sha: files[p].sha } });
      }
      if (init.method === 'DELETE') {
        if (!files[p] || body.sha !== files[p].sha) return resp(409, {});
        delete files[p];
        return resp(200, {});
      }
      return resp(405, {});
    }
    return { files, handler, read: (p) => JSON.parse(SY.b64decode(files[p].content)) };
  }
  const CFG = { owner: 'me', repo: 'data', token: 'good' };
  const TT = RummyTournaments;
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const newState = () => ({ tournaments: [], activeId: null, sync: Object.assign(SY.emptySync(), { legacyDone: true }) });

  test('זיהוי שם המאגר', () => {
    eq(SY.parseRepo('me/data'), { owner: 'me', repo: 'data' });
    eq(SY.parseRepo('https://github.com/me/rummy51-data.git'), { owner: 'me', repo: 'rummy51-data' });
    eq(SY.parseRepo('just-a-name'), null);
  });

  test('קידוד עברית ל-base64 והחזרה', () => {
    const s = JSON.stringify({ name: 'שי ✕ 51' });
    eq(SY.b64decode(SY.b64encode(s)), s);
  });

  test('טוקן שגוי מחזיר הודעה ברורה', async () => {
    const gh = fakeGitHub();
    SY.fetchImpl = gh.handler;
    let msg = '';
    try { await SY.check({ owner: 'me', repo: 'data', token: 'bad' }); } catch (e) { msg = e.message; }
    eq(msg, 'הטוקן לא תקין או שפג תוקפו');
    eq((await SY.check(CFG)).private, true);
  });

  // ---------------- tournaments ----------------
  // games[k] = the rounds of game k: [winnerIdx, pts, hand?] each.
  function tourWith(names, games) {
    const t = R.newTournament('בית', names);
    games.forEach((rounds, k) => {
      const g = R.startGame(t, { rounds: rounds.length });
      rounds.forEach(([w, pts, hand]) => play(g, w, pts, hand));
      R.finishGame(g);
      g.finishedAt = '2026-01-0' + (k + 1) + 'T20:00:00.000Z';
    });
    return t;
  }

  test('הרכב: אותם משתתפים בכל סדר ישיבה הם אותו הרכב', () => {
    eq(TT.lineupKey(['ב', 'א', 'ג']), TT.lineupKey(['ג', ' א ', 'ב']));
    ok(TT.lineupKey(['א', 'ב']) !== TT.lineupKey(['א', 'ב', 'ג']), 'a different lineup');
    eq(TT.defaultName(['אבא', ' דני', 'רון']), 'אבא · דני · רון');
    const t = R.newTournament('', ['א', 'ב']);
    eq(TT.findByLineup([t], ['ב', 'א']).id, t.id);
    t.archived = true;
    eq(TT.findByLineup([t], ['ב', 'א']), null, 'a tournament in the archive is not offered');
  });

  test('טורניר: כל המשתתפים בכל משחק, והמחלק הראשון עובר הלאה', () => {
    const t = R.newTournament('', ['א', 'ב', 'ג']);
    const g = R.startGame(t, { firstDealer: 1 });
    eq(g.players.map((p) => p.id), t.players.map((p) => p.id));
    eq(g.tournamentId, t.id);
    ok(R.openGame(t) === g, 'the new game is the open game');
    eq(R.dealer(g, 0).name, 'ב');
    eq(R.nextFirstDealer(t), 2);
    play(g, 0, [0, 5, 5]);
    R.finishGame(g);
    eq(R.openGame(t), null);
    eq(R.finishedGames(t).length, 1);
  });

  test('טבלת הטורניר: הכי מעט נקודות ראשון, והמקומות זזים רק בסוף משחק', () => {
    // game 1: A -30, B 10, C 50 · game 2: A 20, B -30, C 5
    const t = tourWith(['A', 'B', 'C'], [[[0, [0, 10, 50]]], [[1, [20, 0, 5]]]]);
    eq(R.standings(t).map((r) => [r.player.name, r.total, r.wins, r.place]), [['B', -20, 1, 1], ['A', -10, 1, 2], ['C', 55, 0, 3]]);
    const mv = R.placeMoves(t);
    eq([mv.p1, mv.p2, mv.p3], [-1, 1, 0], 'places moved when game 2 ended');
    eq(R.tourLeaders(t).map((p) => p.name), ['B']);
    const g = R.startGame(t, {});
    play(g, 2, [40, 40, 0]);
    const rows = R.standings(t);
    eq(rows.map((r) => r.player.name), ['B', 'A', 'C'], 'the open game does not move anyone');
    eq(rows.map((r) => r.game), [40, 40, -30]);
  });

  test('שוויון בנקודות: מי שניצח ביותר משחקים, ובלי הבדל — אותו מקום', () => {
    const t = tourWith(['A', 'B', 'C'], [[[0, [0, 20, 50]]], [[0, [0, 0, 30]]], [[2, [80, 0, 0]]]]);
    eq(R.standings(t).map((r) => [r.player.name, r.total, r.wins, r.place]), [['A', 20, 2, 1], ['B', 20, 0, 2], ['C', 50, 1, 3]]);
    const even = tourWith(['A', 'B'], [[[0, [0, 30]]], [[1, [30, 0]]]]);
    eq(R.standings(even).map((r) => r.place), [1, 1]);
    eq(R.tourLeaders(even).length, 2);
  });

  test('תיקון תור במשחק שהסתיים: הניקוד בטורניר והמנצח מתעדכנים', () => {
    const t = tourWith(['A', 'B'], [[[0, [0, 10]], [1, [5, 0]]]]); // A -25, B -20
    const g = R.finishedGames(t)[0];
    eq(R.playerById(g, g.winnerId).name, 'A');
    R.setResult(g, 1, { winnerId: 'p2', hand: true, entries: { p1: { points: 5 } } }); // A -20, B -50
    eq(R.refreshWinner(g), null);
    eq(R.playerById(g, g.winnerId).name, 'B');
    eq(R.standings(t).map((r) => [r.player.name, r.total]), [['B', -50], ['A', -20]]);

    const h = R.newGame(['A', 'B', 'C'], { rounds: 2 });
    play(h, 0, [0, 30, 30]); play(h, 1, [30, 0, 0]); // A 0, B 0, C 30
    R.finishGame(h, 'p1');
    R.setResult(h, 1, { winnerId: 'p3', hand: false, entries: { p1: { points: 30 }, p2: { points: 30 } } }); // A 0, B 60, C 0
    eq(R.refreshWinner(h), null, 'the winner is still tied for the lowest total');
    eq(h.winnerId, 'p1');
    R.setResult(h, 0, { winnerId: 'p2', hand: false, entries: { p1: { points: 0 }, p3: { points: 30 } } }); // A 30, B 0, C 0
    eq(R.refreshWinner(h).map((p) => p.name), ['B', 'C'], 'a tie without the winner: someone chooses');
  });

  test('תקציר קריא לקובץ: טבלה, ניקוד כל משחק והמשחק הפתוח', () => {
    const t = tourWith(['שי', 'דנה'], [[[0, [0, 12]]]]);
    const g = R.startGame(t, {});
    play(g, 1, [8, 0]);
    const d = R.digest(t);
    eq(d.participants, ['שי', 'דנה']);
    eq(d.standings, [{ place: 1, name: 'שי', total: -30, wins: 1, games: 1 }, { place: 2, name: 'דנה', total: 12, wins: 0, games: 1 }]);
    eq([d.games[0].number, d.games[0].winner, d.games[0].totals], [1, 'שי', { 'שי': -30, 'דנה': 12 }]);
    eq([d.openGame.roundsPlayed, d.openGame.totals], [1, { 'שי': 8, 'דנה': -30 }]);
  });

  test('מחיקת משחק נשמרת גם אחרי איחוד עם עותק שעוד יש בו את המשחק', () => {
    const t = tourWith(['A', 'B'], [[[0, [0, 10]]], [[1, [10, 0]]]]);
    const copy = clone(t);
    R.removeGame(t, R.finishedGames(t)[0].id);
    const m = TT.mergeTournament(t, copy);
    eq(m.tournament.games.length, 1);
    eq([m.changed, m.ahead], [false, true]);
  });

  test('איחוד שני טלפונים: כל משחק מהעותק שעודכן אחרון, והשם מהשינוי האחרון', () => {
    const base = tourWith(['A', 'B'], [[[0, [0, 10]]]]);
    base.metaAt = R.finishedGames(base)[0].updatedAt = '2026-01-01T00:00:00.000Z'; // older than the changes below
    const a = clone(base), b = clone(base);
    const g = R.startGame(a, {});
    play(g, 0, [0, 5]);
    g.updatedAt = '2026-02-01T00:00:00.000Z';
    b.name = 'שם חדש';
    b.metaAt = '2026-02-02T00:00:00.000Z';
    R.finishedGames(b)[0].rounds[0].result.entries.p2.points = 15; // corrected on phone b
    R.finishedGames(b)[0].updatedAt = '2026-02-03T00:00:00.000Z';
    const m = TT.mergeTournament(a, b);
    eq(m.tournament.name, 'שם חדש');
    eq(R.playedCount(R.openGame(m.tournament)), 1);
    eq(R.totals(R.finishedGames(m.tournament)[0]).p2, 15);
    eq([m.changed, m.ahead], [true, true]);
    eq(TT.sig(TT.mergeTournament(b, a).tournament), TT.sig(m.tournament), 'both phones end with the same copy');
  });

  test('המרה מהגרסה הקודמת: כל משחק עובר לטורניר שלו, והמשתתפים מותאמים לפי השם', () => {
    const g1 = R.newGame(['A', 'B', 'C'], { rounds: 1 });
    play(g1, 0, [0, 10, 20]); R.finishGame(g1);
    Object.assign(g1, { finishedAt: '2026-01-01T20:00:00.000Z', tournamentId: 'x1', tournamentName: 'בית' });
    const g2 = R.newGame(['C', 'A', 'B'], { rounds: 1 }); // another seating order
    play(g2, 0, [0, 5, 7]); R.finishGame(g2);
    Object.assign(g2, { finishedAt: '2026-01-02T20:00:00.000Z', tournamentId: 'x1' });
    const cur = R.newGame(['B', 'C', 'A']);
    play(cur, 1, [3, 0, 4]);
    cur.tournamentId = 'x1';
    const other = R.newGame(['A', 'D'], { rounds: 1 });
    play(other, 1, [9, 0]); R.finishGame(other);
    other.finishedAt = '2026-01-03T20:00:00.000Z';
    const old = { history: [g2, g1, other], current: cur, tournaments: [{ id: 'x1', name: 'בית', createdAt: '2025-12-31T00:00:00.000Z', updatedAt: '2025-12-31T00:00:00.000Z' }] };
    const list = TT.fromV1(old);
    eq(list.map((t) => t.name), ['בית', 'A · D']);
    const t = list[0];
    eq(t.players.map((p) => p.name), ['A', 'B', 'C']);
    eq(R.finishedGames(t).length, 2);
    eq(R.playedCount(R.openGame(t)), 1, 'the open game moves too');
    eq(R.standings(t).map((r) => [r.player.name, r.total, r.wins]), [['A', -25, 1], ['C', -10, 1], ['B', 17, 0]]);
    eq(TT.sig(TT.fromV1(old)[0]), TT.sig(t), 'the same data gets the same ids on every phone');
  });

  test('העברת מזהי משתתפים במשחק (העברה לטורניר אחר)', () => {
    const g = R.newGame(['A', 'B'], { rounds: 1 });
    play(g, 1, [7, 0]);
    const m = TT.remapGame(g, { p1: 'n1', p2: 'n2' });
    eq(m.players.map((p) => p.id), ['n1', 'n2']);
    eq(m.rounds[0].result.winnerId, 'n2');
    eq(Object.keys(m.rounds[0].result.entries), ['n1']);
    eq(R.totals(m), { n1: 7, n2: -30 });
  });

  test('סקירת טורנירים: המוביל הוא מי שצבר הכי מעט נקודות', () => {
    // A: -30 +10 +10 = -10 (1 win) · B: 50 -30 -30 = -10 (2 wins)
    const t = tourWith(['A', 'B'], [[[0, [0, 50]]], [[1, [10, 0]]], [[1, [10, 0]]]]);
    const row = TT.overview([t])[0];
    eq([row.games, row.leaders.map((l) => l.player.name)], [3, ['B']]);
    const gone = TT.tombstone(R.newTournament('', ['X', 'Y']));
    eq(TT.overview([t, gone]).length, 1);
    eq(TT.allGames([t, gone]).length, 3);
    ok(TT.findGame([t], R.finishedGames(t)[1].id).tour === t, 'a game is found with its tournament');
    eq(ST.filterByTournament(TT.allGames([t]), t.id).length, 3);
  });

  // ---------------- sync (against a fake GitHub) ----------------
  test('גיט: קובץ לכל טורניר עם תקציר קריא, וטלפון חדש מקבל הכול', async () => {
    const gh = fakeGitHub();
    SY.fetchImpl = gh.handler;
    const a = newState();
    const t = tourWith(['שי', 'דנה'], [[[0, [0, 12]]]]);
    R.startGame(t, {});
    a.tournaments.push(t);
    SY.markDirty(a, t.id);
    eq(SY.pending(a), 1);
    await SY.flush(a, CFG);
    eq(SY.pending(a), 0);
    const file = gh.read(SY.tournamentPath(t.id));
    eq(file.summary.standings.map((r) => [r.name, r.total]), [['שי', -30], ['דנה', 12]]);
    eq(file.summary.games[0].winner, 'שי');
    eq(file.summary.openGame.roundsPlayed, 0);
    eq(file.games.length, 2);

    const b = newState();
    const res = await SY.pull(b, CFG);
    eq(res.added, 1);
    eq(b.tournaments[0].summary, undefined, 'the digest is not kept on the phone');
    eq(TT.sig(b.tournaments[0]), TT.sig(t));
    eq(SY.pending(b), 0);
  });

  test('גיט: שני טלפונים שומרים את אותו טורניר, ושום שינוי לא הולך לאיבוד', async () => {
    const gh = fakeGitHub();
    SY.fetchImpl = gh.handler;
    const a = newState();
    const t = tourWith(['A', 'B'], [[[0, [0, 10]]]]);
    t.metaAt = '2026-01-01T00:00:00.000Z'; // older than the rename below
    a.tournaments.push(t);
    SY.markDirty(a, t.id);
    await SY.flush(a, CFG);
    const b = newState();
    await SY.pull(b, CFG);
    const tb = b.tournaments[0];
    const g = R.startGame(tb, {});
    play(g, 1, [7, 0]);
    SY.markDirty(b, tb.id);
    await SY.flush(b, CFG);
    const ta = a.tournaments[0];
    ta.name = 'אצל סבתא';
    R.touchMeta(ta);
    SY.markDirty(a, ta.id);
    await SY.flush(a, CFG); // the file changed since phone a saw it: merged, then saved
    const file = gh.read(SY.tournamentPath(t.id));
    eq(file.name, 'אצל סבתא');
    eq(R.playedCount(file.games[1]), 1);
    eq(R.playedCount(R.openGame(a.tournaments[0])), 1, 'phone a got the game from phone b');
  });

  test('שינוי בטורניר בזמן שמירה נשאר ממתין', async () => {
    const gh = fakeGitHub();
    const st = newState();
    const t = R.newTournament('', ['A', 'B']);
    st.tournaments.push(t);
    SY.markDirty(st, t.id);
    SY.fetchImpl = async (url, init) => {
      if (init.method === 'PUT') SY.markDirty(st, t.id); // a change lands while the request is in flight
      return gh.handler(url, init);
    };
    await SY.flush(st, CFG);
    eq(SY.pending(st), 1, 'the newer version is still pending');
  });

  test('גיט: הקבצים של הגרסה הקודמת מומרים פעם אחת, בלי כפילויות', async () => {
    const gh = fakeGitHub();
    SY.fetchImpl = gh.handler;
    const oldTour = { id: 'x1', name: 'בית', createdAt: '2025-12-31T00:00:00.000Z', updatedAt: '2025-12-31T00:00:00.000Z' };
    const g1 = R.newGame(['A', 'B'], { rounds: 1 });
    play(g1, 0, [0, 10]); R.finishGame(g1);
    Object.assign(g1, { finishedAt: '2026-01-01T20:00:00.000Z', tournamentId: 'x1' });
    const g2 = R.newGame(['B', 'A'], { rounds: 1 });
    play(g2, 0, [0, 4]); R.finishGame(g2);
    Object.assign(g2, { finishedAt: '2026-01-02T20:00:00.000Z', tournamentId: 'x1' });
    const put = (path, data) => { gh.files[path] = { content: SY.b64encode(JSON.stringify(data)), sha: 'old-' + path }; };
    put('data/games/2026-01-01_' + g1.id + '.json', g1);
    put('data/games/2026-01-02_' + g2.id + '.json', g2);
    put('data/tournaments.json', { tournaments: [oldTour] });
    // this phone had only the first game (the second was saved from another phone)
    const st = newState();
    st.sync.legacyDone = false;
    st.tournaments = TT.fromV1({ history: [g1], current: null, tournaments: [oldTour] });
    const res = await SY.pull(st, CFG);
    eq(st.sync.legacyDone, true);
    eq(st.tournaments.length, 1);
    eq(st.tournaments[0].players.map((p) => p.name), ['A', 'B']);
    eq(R.finishedGames(st.tournaments[0]).length, 2);
    eq(res.updated, 1);
    eq(SY.pending(st), 1, 'the converted tournament is queued for its new file');
    await SY.flush(st, CFG);
    ok(gh.files['data/tournaments/x1.json'], 'the new file is written');
    ok(gh.files['data/tournaments.json'] && gh.files['data/games/2026-01-01_' + g1.id + '.json'], 'the old files are left as they are');
    const again = await SY.pull(st, CFG);
    eq([again.added, again.updated], [0, 0]);
  });

  // ---------------- run ----------------
  const out = document.getElementById('out');
  let pass = 0;
  const failures = [];
  for (const [name, fn] of tests) {
    const li = document.createElement('li');
    try {
      await fn();
      pass++;
      li.className = 'pass';
      li.textContent = '✓ ' + name;
    } catch (e) {
      failures.push(name + ': ' + e.message);
      li.className = 'fail';
      li.textContent = '✗ ' + name;
      const small = document.createElement('small');
      small.textContent = e.message;
      li.appendChild(small);
    }
    out.appendChild(li);
  }
  SY.fetchImpl = null;
  const sum = document.getElementById('sum');
  sum.textContent = failures.length ? `${failures.length} נכשלו, ${pass} עברו` : `כל ${pass} הבדיקות עברו`;
  sum.className = failures.length ? 'fail' : 'pass';
  window.testResults = { pass, fail: failures.length, failures };
})();
</script>
</body>
